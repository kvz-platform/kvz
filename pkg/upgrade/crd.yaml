# upgrade.cattle.io/v1 Plan, served by kvz's in-process upgrade controller
# (pkg/upgrade). The schema is permissive so Plans written for the upstream
# system-upgrade-controller apply unchanged.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plans.upgrade.cattle.io
spec:
  group: upgrade.cattle.io
  scope: Namespaced
  names: {kind: Plan, listKind: PlanList, plural: plans, singular: plan}
  versions:
  - name: v1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Version, type: string, jsonPath: .spec.version}
    - {name: Channel, type: string, jsonPath: .spec.channel, priority: 1}
    - {name: Latest, type: string, jsonPath: .status.latestVersion}
    - {name: Complete, type: string, jsonPath: '.status.conditions[?(@.type=="Complete")].status'}
    - {name: Message, type: string, jsonPath: '.status.conditions[?(@.type=="Complete")].message', priority: 1}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              concurrency: {type: integer, minimum: 0}
              version: {type: string}
              channel: {type: string}
              cordon: {type: boolean}
              nodeSelector: {type: object, x-kubernetes-preserve-unknown-fields: true}
              drain: {type: object, x-kubernetes-preserve-unknown-fields: true}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
