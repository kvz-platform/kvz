name: Feature request
description: Suggest something kvz should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. YAML or commands welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
