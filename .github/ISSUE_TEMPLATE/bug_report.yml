name: Bug report
description: Something in kvz doesn't work the way the docs say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go through
        [private reporting](https://github.com/kvz-platform/kvz/security/advisories/new) instead.**
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of commands or YAML that shows the problem.
      render: shell
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: kvz version
      description: Output of `kvz version`
      placeholder: kvz v1.35.6-12 (Kubernetes v1.35.6)
    validations: {required: true}
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: Mac mini M4, 16 GB, macOS 26.6.2
    validations: {required: true}
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      multiple: true
      options: [linux, macos, darwin, apple, not pod-specific]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `kvz server` output, `kubectl describe pod`, or `~/.kvz/logs`. Remove tokens first.
      render: text
